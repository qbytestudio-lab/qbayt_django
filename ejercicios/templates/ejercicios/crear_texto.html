{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Texto — QBYT</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'ejercicios/css/crear_texto.css' %}">
</head>
<body>

<div class="texto-creator-container">
    
    <!-- Header -->
    <div class="texto-header">
        <a href="{% url 'detalle_clase' clase.id %}" class="back-link">
            <i class="bi bi-arrow-left"></i> Volver a {{ clase.nombre }}
        </a>
        <h1 class="texto-title">
            <i class="bi bi-file-text-fill"></i> Crear Texto / Lectura
        </h1>
        <p class="texto-subtitle">Crea material de lectura para tus estudiantes</p>
    </div>

    <form method="POST" action="{% url 'crear_texto' clase.id %}" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Info General -->
        <div class="form-card">
            <div class="mb-3">
                <label class="form-label">
                    Título <span class="required">*</span>
                </label>
                <input type="text" name="titulo" class="form-control" 
                       placeholder="Ej: Introducción a la armonía musical" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">
                    Contenido <span class="required">*</span>
                </label>
                <textarea name="contenido" class="form-control" rows="10" required
                          placeholder="Escribe aquí el contenido de la lectura..."></textarea>
            </div>
            
            <div class="mb-0">
                <label class="form-label">Fecha límite (opcional)</label>
                <input type="datetime-local" name="fecha_limite" class="form-control">
            </div>
        </div>

        <!-- Imagen -->
        <div class="form-card">
            <label class="form-label">Imagen de referencia (opcional)</label>
            <div class="image-upload-area" onclick="document.getElementById('imagenInput').click()">
                <i class="bi bi-cloud-upload"></i>
                <p>Haz clic para subir una imagen</p>
                <p style="font-size: 0.75rem; color: var(--spotify-muted);">PNG, JPG, GIF (máx 5MB)</p>
                <img id="imagePreview" class="image-preview">
            </div>
            <input type="file" id="imagenInput" name="imagen" accept="image/*" 
                   style="display: none;" onchange="previewImage(this)">
        </div>

        <!-- Footer -->
        <div class="form-footer">
            <a href="{% url 'detalle_clase' clase.id %}" class="btn-cancelar">
                <i class="bi bi-x-lg"></i> Cancelar
            </a>
            <button type="submit" class="btn-submit">
                <i class="bi bi-check-lg"></i> Crear Texto
            </button>
        </div>
    </form>

</div>

<script>
function previewImage(input) {
    const preview = document.getElementById('imagePreview');
    const uploadArea = input.closest('.image-upload-area');
    
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.classList.add('show');
            
            // Ocultar icono y texto
            uploadArea.querySelector('i').style.display = 'none';
            uploadArea.querySelectorAll('p').forEach(p => p.style.display = 'none');
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
