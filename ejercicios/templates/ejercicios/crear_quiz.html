{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Quiz — QBYT</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'ejercicios/css/crear_quiz.css' %}">
</head>
<body>

<div class="quiz-creator-container">
    
    <!-- Header -->
    <div class="quiz-header">
        <a href="{% url 'detalle_clase' clase.id %}" class="back-link">
            <i class="bi bi-arrow-left"></i> Volver a {{ clase.nombre }}
        </a>
        <h1 class="quiz-title">
            <i class="bi bi-patch-question-fill"></i> Crear Quiz
        </h1>
        <p class="quiz-subtitle">Crea preguntas de selección múltiple para evaluar a tus estudiantes</p>
    </div>

    <form method="POST" action="{% url 'ejercicios:crear_quiz' clase.id %}" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Info General -->
        <div class="form-card">
            <div class="mb-3">
                <label class="form-label">
                    Título del Quiz <span class="required">*</span>
                </label>
                <input type="text" name="titulo" class="form-control" 
                       placeholder="Ej: Quiz de acordes mayores" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción (opcional)</label>
                <textarea name="descripcion" class="form-control" rows="2" 
                          placeholder="Instrucciones para el estudiante..."></textarea>
            </div>
            <div class="mb-0">
                <label class="form-label">Fecha límite (opcional)</label>
                <input type="datetime-local" name="fecha_limite" class="form-control">
            </div>
        </div>

        <!-- Preguntas -->
        <div id="preguntasContainer"></div>

        <!-- Botón Agregar -->
        <button type="button" class="btn-add-pregunta" onclick="agregarPregunta()">
            <i class="bi bi-plus-lg"></i> Agregar pregunta
        </button>

        <!-- Footer -->
        <div class="form-footer">
            <a href="{% url 'detalle_clase' clase.id %}" class="btn-cancelar">
                <i class="bi bi-x-lg"></i> Cancelar
            </a>
            <button type="submit" class="btn-submit">
                <i class="bi bi-check-lg"></i> Crear Quiz
            </button>
        </div>
    </form>

</div>

<script>
let preguntaCount = 0;

function agregarPregunta() {
    preguntaCount++;
    const container = document.getElementById('preguntasContainer');
    const div = document.createElement('div');
    div.className = 'pregunta-card';
    div.id = `pregunta-${preguntaCount}`;
    div.innerHTML = `
        <div class="pregunta-number">${preguntaCount}</div>
        
        <button type="button" class="btn-delete-pregunta" onclick="eliminarPregunta(${preguntaCount})" title="Eliminar pregunta">
            <i class="bi bi-trash"></i>
        </button>
        
        <div class="mb-3 mt-2">
            <label class="form-label">Pregunta ${preguntaCount} <span class="required">*</span></label>
            <input type="text" name="pregunta_${preguntaCount}" class="form-control" required
                   placeholder="Escribe la pregunta...">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Imagen de la pregunta (opcional)</label>
            <input type="file" name="imagen_pregunta_${preguntaCount}" class="form-control" 
                   accept="image/*" style="padding: 0.5rem !important;">
        </div>
        
        <label class="form-label" style="margin-top: 0.5rem;">
            Opciones <span style="color: var(--spotify-muted); font-weight: 400; font-size: 0.75rem;">(marca el círculo verde para la correcta)</span>
        </label>
        
        <div class="opciones-container">
            ${[1, 2, 3, 4].map(j => `
                <div class="opcion-row">
                    <input type="radio" name="correcta_${preguntaCount}" value="${j}" 
                           class="radio-correcta" ${j === 1 ? 'checked' : ''}
                           title="Marcar como correcta">
                    <input type="text" name="opcion_${preguntaCount}_${j}" class="form-control opcion-input" 
                           placeholder="Opción ${j}" ${j <= 2 ? 'required' : ''}>
                    <span class="correcta-label">✓ Correcta</span>
                </div>
            `).join('')}
        </div>
    `;
    
    container.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'center' });
    
    setTimeout(() => {
        div.querySelector('input[type="text"]').focus();
    }, 300);
}

function eliminarPregunta(id) {
    const card = document.getElementById(`pregunta-${id}`);
    if (card) {
        card.style.opacity = '0';
        card.style.transform = 'translateX(20px)';
        card.style.transition = 'all 0.3s ease';
        setTimeout(() => {
            card.remove();
            renumerarPreguntas();
        }, 300);
    }
}

function renumerarPreguntas() {
    const cards = document.querySelectorAll('.pregunta-card');
    preguntaCount = cards.length;
    cards.forEach((card, index) => {
        const num = index + 1;
        card.querySelector('.pregunta-number').textContent = num;
        card.querySelector('.form-label').textContent = `Pregunta ${num} *`;
        
        // Renombrar inputs
        card.querySelectorAll('input[name^="pregunta_"]').forEach(input => {
            input.name = `pregunta_${num}`;
        });
        card.querySelectorAll('input[name^="imagen_pregunta_"]').forEach(input => {
            input.name = `imagen_pregunta_${num}`;
        });
        card.querySelectorAll('input[name^="correcta_"]').forEach(input => {
            input.name = `correcta_${num}`;
        });
        card.querySelectorAll('input[name^="opcion_"]').forEach(input => {
            const optionNum = input.name.split('_').pop();
            input.name = `opcion_${num}_${optionNum}`;
        });
    });
}

// Iniciar con 1 pregunta
agregarPregunta();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
