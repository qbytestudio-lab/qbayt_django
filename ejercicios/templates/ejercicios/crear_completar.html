{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Completar Espacios — QBYT</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'ejercicios/css/crear_completar.css' %}">
</head>
<body>

<div class="completar-creator-container">
    
    <!-- Header -->
    <div class="completar-header">
        <h1 class="completar-title">
            <i class="bi bi-input-cursor-text"></i> Crear Completar Espacios
        </h1>
        <p class="completar-subtitle">
            Usa <strong>[____]</strong> para indicar dónde va el espacio en blanco
        </p>
    </div>

    <form method="POST" action="{% url 'ejercicios:crear_ejercicio' clase.id %}">
        {% csrf_token %}
        <input type="hidden" name="tipo" value="completar">

        <!-- Info General -->
        <div class="completar-form-card">
            <div class="mb-3">
                <label class="completar-form-label">
                    Título del ejercicio <span class="required">*</span>
                </label>
                <input type="text" name="titulo" class="completar-form-control" 
                       placeholder="Ej: Completa las frases musicales" required>
            </div>
            <div class="mb-3">
                <label class="completar-form-label">Descripción (opcional)</label>
                <textarea name="descripcion" class="completar-form-control" rows="2" 
                          placeholder="Instrucciones para el estudiante..."></textarea>
            </div>
            <div class="mb-0">
                <label class="completar-form-label">Fecha límite (opcional)</label>
                <input type="datetime-local" name="fecha_limite" class="completar-form-control">
            </div>
        </div>

        <!-- Frases -->
        <div id="frasesContainer"></div>

        <!-- Botón Agregar -->
        <button type="button" class="btn-add-frase" onclick="agregarFrase()">
            <i class="bi bi-plus-lg"></i> Agregar frase
        </button>

        <!-- Submit -->
        <div style="text-align: right;">
            <button type="submit" class="btn-submit">
                <i class="bi bi-check-lg"></i> Crear Ejercicio
            </button>
        </div>
    </form>

</div>

<script>
let count = 0;

function agregarFrase() {
    count++;
    const container = document.getElementById('frasesContainer');
    const div = document.createElement('div');
    div.className = 'frase-card';
    div.id = `frase-${count}`;
    div.innerHTML = `
        <div class="frase-number">${count}</div>
        
        <button type="button" class="btn-delete-frase" onclick="eliminarFrase(${count})" title="Eliminar frase">
            <i class="bi bi-trash"></i>
        </button>
        
        <div class="mb-3 mt-2">
            <label class="completar-form-label">Frase ${count} <span class="required">*</span></label>
            <input type="text" name="frase_${count}" class="completar-form-control" required
                   placeholder="Ej: El pentagrama tiene [____] líneas">
            <div class="help-box">
                <i class="bi bi-info-circle"></i>
                Usa <strong>[____]</strong> para marcar el espacio en blanco
            </div>
        </div>
        
        <div class="mb-0">
            <label class="completar-form-label">Respuesta correcta <span class="required">*</span></label>
            <input type="text" name="respuesta_${count}" class="completar-form-control" required
                   placeholder="Ej: cinco">
        </div>
    `;
    
    container.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'center' });
    
    setTimeout(() => {
        div.querySelector('input[type="text"]').focus();
    }, 300);
}

function eliminarFrase(id) {
    const card = document.getElementById(`frase-${id}`);
    if (card) {
        card.style.opacity = '0';
        card.style.transform = 'translateX(20px)';
        card.style.transition = 'all 0.3s ease';
        setTimeout(() => {
            card.remove();
            renumerarFrases();
        }, 300);
    }
}

function renumerarFrases() {
    const cards = document.querySelectorAll('.frase-card');
    count = cards.length;
    cards.forEach((card, index) => {
        const num = index + 1;
        card.querySelector('.frase-number').textContent = num;
        card.querySelector('.completar-form-label').textContent = `Frase ${num} *`;
        card.querySelectorAll('input[type="text"]').forEach(input => {
            if (input.name.startsWith('frase_')) {
                input.name = `frase_${num}`;
            } else if (input.name.startsWith('respuesta_')) {
                input.name = `respuesta_${num}`;
            }
        });
    });
}

// Iniciar con 1 frase
agregarFrase();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
