<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configurar Nivel — QBYT</title>
    {% load static %}
    
    <!-- Google Fonts Syne -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- ENLACE AL ARCHIVO CSS SEPARADO -->
    <link rel="stylesheet" href="{% static 'estudiante/css/configurar_nivel.css' %}">
</head>
<body>

<div class="container py-4" style="max-width: 650px;">
    <div class="config-container">
        
        <div class="config-header text-center">
            <span class="badge mb-2" style="background: rgba(124, 111, 255, 0.15); color: #a89fff; font-size: 0.75rem; padding: 0.4rem 0.9rem; border-radius: 20px; font-weight: 600;">
                <i class="bi bi-music-note-beamed"></i> Primeros pasos en QBYT
            </span>
            <h2>¿Cuál es tu nivel musical actual?</h2>
            <p>Selecciona la opción que mejor se adapte a tus conocimientos para personalizar tu experiencia de aprendizaje.</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="d-flex flex-column gap-3 mb-4">
                
                <label class="nivel-option nivel-1">
                    <div class="d-flex align-items-start gap-3">
                        <input class="form-check-input mt-1" type="radio" name="nivel" value="1" required>
                        <div>
                            <div class="nivel-title">1 - Bajo</div>
                            <div class="nivel-desc">No sabe nada de música o está empezando desde cero absoluto. Aprenderás desde las bases fundamentales.</div>
                        </div>
                    </div>
                </label>

                <label class="nivel-option nivel-2">
                    <div class="d-flex align-items-start gap-3">
                        <input class="form-check-input mt-1" type="radio" name="nivel" value="2">
                        <div>
                            <div class="nivel-title">2 - Medio</div>
                            <div class="nivel-desc">Conoce algunas nociones básicas y conceptos generales de música. Ideal para afianzar lo que ya sabes.</div>
                        </div>
                    </div>
                </label>

                <label class="nivel-option nivel-3">
                    <div class="d-flex align-items-start gap-3">
                        <input class="form-check-input mt-1" type="radio" name="nivel" value="3">
                        <div>
                            <div class="nivel-title">3 - Intermedio</div>
                            <div class="nivel-desc">Ya comprende teoría musical y maneja bastantes conceptos. Listo para retos de entrenamiento auditivo avanzados.</div>
                        </div>
                    </div>
                </label>

                <label class="nivel-option nivel-4">
                    <div class="d-flex align-items-start gap-3">
                        <input class="form-check-input mt-1" type="radio" name="nivel" value="4">
                        <div>
                            <div class="nivel-title">4 - Experto</div>
                            <div class="nivel-desc">Dominio avanzado, con amplia experiencia y conocimientos profundos en teoría y práctica musical.</div>
                        </div>
                    </div>
                </label>

            </div>

            <button type="submit" class="btn-continuar">
                Guardar y Continuar <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>
    </div>
</div>

<script>
    document.querySelectorAll('.nivel-option').forEach(card => {
        card.addEventListener('click', function() {
            document.querySelectorAll('.nivel-option').forEach(c => c.classList.remove('selected'));
            this.classList.add('selected');
            
            const radio = this.querySelector('input[type="radio"]');
            if (radio) radio.checked = true;
        });
    });
</script>

</body>
</html>
