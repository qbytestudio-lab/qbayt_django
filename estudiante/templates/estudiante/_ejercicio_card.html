<div class="ej-card estado-{{ estado }}"
     onclick="abrirModalEjercicio(this)"
     data-titulo="{{ ejercicio.titulo|escapejs }}"
     data-descripcion="{{ ejercicio.descripcion|default:''|escapejs }}"
     data-tipo="{{ ejercicio.get_tipo_display|default:'Ejercicio'|escapejs }}"
     data-estado="{{ estado }}"
     data-estado-label="{{ estado_label|escapejs }}"
     data-estado-icon="{{ estado_icon }}"
     data-fecha-limite="{% if ejercicio.fecha_limite %}{{ ejercicio.fecha_limite|date:'d/m/Y H:i' }}{% else %}Sin fecha límite{% endif %}"
     data-fecha-limite-raw="{% if ejercicio.fecha_limite %}1{% else %}0{% endif %}"
     data-docente="{{ clase.docente.get_full_name|default:clase.docente.username|escapejs }}"
     data-disponible="{% if estado == 'activo' %}1{% else %}0{% endif %}"
     data-url-resolver="{% url 'estudiante:resolver_ejercicio' clase.id ejercicio.id %}">

    <div class="ej-card-icon">
        <i class="bi {{ estado_icon }}"></i>
    </div>

    <h4 class="ej-card-title">{{ ejercicio.titulo }}</h4>

    {% if ejercicio.descripcion %}
        <p class="ej-card-desc">{{ ejercicio.descripcion }}</p>
    {% else %}
        <p class="ej-card-desc ej-card-desc-empty">Sin descripción</p>
    {% endif %}

    <div class="ej-card-meta">
        <span class="ej-card-tipo">{{ ejercicio.get_tipo_display|default:"Ejercicio" }}</span>
        <span class="ej-badge {{ estado }}">
            <i class="bi {{ estado_icon }}"></i> {{ estado_label }}
        </span>
    </div>
</div>
