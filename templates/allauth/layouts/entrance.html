{% load static %}
<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block head_title %}QBYT{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'web/css/auth.css' %}">
    <link rel="icon" type="image/png" href="{% static 'web/img/logo5.png' %}">
</head>
<body>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">

            <div class="auth-header">
                <i class="bi bi-music-note-beamed auth-icon login-icon"></i>
                <h2>{% block auth_title %}Continuar{% endblock %}</h2>
                <p>{% block auth_subtitle %}Estás a un paso{% endblock %}</p>
            </div>

            {% if messages %}
            {% for msg in messages %}
            <div class="alert {% if 'error' in msg.tags or 'danger' in msg.tags %}alert-danger{% elif 'success' in msg.tags %}alert-success{% elif 'warning' in msg.tags %}alert-warning{% else %}alert-info{% endif %} alert-dismissible fade show">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
            {% endif %}

            {% block content %}{% endblock %}

            <div class="music-waves login-waves">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>

            <div class="auth-footer">
                <a href="/registro/" style="color: #b3b3b3; font-size: 0.85rem; text-decoration: none;">
                    <i class="bi bi-arrow-left me-1"></i> Volver al registro
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
